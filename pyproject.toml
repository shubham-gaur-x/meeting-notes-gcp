[project]
name = "meeting-notes-gcp"
version = "0.1.0"
description = "GCP-native meeting memory pipeline — Cloud Run, Cloud SQL, Vertex AI, Memgraph"
requires-python = ">=3.11"

# Pin deliberately. v5 lost time to unpinned-dependency shape drift in a third-party
# SDK; the fix was pinning. Resolve concrete versions in Phase 1.
dependencies = [
    # Web / async
    "fastapi",
    "uvicorn[standard]",
    "httpx",                        # the ONLY HTTP client. Never `requests`.
    # Models / config
    "pydantic>=2",
    "pydantic-settings",
    # Data
    "asyncpg",
    "cloud-sql-python-connector[asyncpg]",
    "neo4j",                        # Bolt driver for Memgraph
    # GCP
    "google-cloud-secret-manager",
    "google-cloud-pubsub",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
    "google-cloud-aiplatform",      # Vertex AI
    # Local-dev LLM backend
    "openai",                       # LM Studio's OpenAI-compatible API only
    # Logging
    "structlog",
    # .env loading for local development. Cloud Run injects env vars directly,
    # so this is a local-only convenience — never a production dependency.
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "anyio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meeting_notes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test must run with no live GCP, no database, no LLM. v5 achieved this for
# 363 tests. A test needing live credentials is a broken test.
# async def tests need no per-test marker.
asyncio_mode = "auto"
# Integration tests need the local Docker stack (`make demo-up`). They are
# excluded from the default run so `make test` stays service-free, per
# CLAUDE.md: "a test requiring live credentials is a broken test".
markers = ["integration: needs the local Docker stack (make demo-up)"]
addopts = "-q -m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The extraction prompt is carried from v5 byte for byte and contains lines
# over the limit. Reflowing tuned prompt text to satisfy a linter is not a
# trade worth making, so E501 is waived for that ONE data-only module rather
# than for extractor.py, where real code still has to comply.
"meeting_notes/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true        # CLAUDE.md: type hints on ALL signatures
ignore_missing_imports = true
